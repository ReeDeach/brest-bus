<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6bcb">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Автобусы из Бреста</title>
<style>
:root{--bg:#f4f6f9;--cd:#fff;--tx:#14213d;--mu:#6b7686;--ac:#0b6bcb;--ln:#e3e8ef;--ok:#0a7d4b}
@media(prefers-color-scheme:dark){:root{--bg:#0e141b;--cd:#18212c;--tx:#e8edf3;--mu:#93a0b1;--ac:#5aa9ff;--ln:#263241;--ok:#4cd199}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{background:#0b6bcb;color:#fff;padding:14px 16px 12px}
h1{margin:0;font-size:20px}
header p{margin:2px 0 0;font-size:13px;opacity:.9}
header a{color:#fff;font-weight:600}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--ln)}
input[type=search]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);color:var(--tx)}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--mu)}
main{padding:10px 12px 24px;max-width:720px;margin:0 auto}
.t{display:flex;gap:12px;align-items:center;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.t.past{opacity:.45}
.tm{font-size:22px;font-weight:700;min-width:64px}
.in{flex:1;min-width:0}
.nm{font-weight:600}
.sb{font-size:13px;color:var(--mu)}
.soon{color:var(--ok);font-weight:600}
.pl{text-align:center;font-size:12px;color:var(--mu)}
.pl b{display:block;font-size:18px;color:var(--ac)}
.note{color:var(--mu);font-size:13px;text-align:center;padding:14px 4px}
</style></head><body>
<header><h1>Автобусы из Бреста</h1>
<p>Пригородные рейсы · справка <a href="tel:+375162933704">93-37-04</a> или <a href="tel:114">114</a></p></header>
<div class="bar">
<div class="chips" id="dir"><button class="chip on" data-r="0">Из Бреста</button><button class="chip" data-r="1">В Брест</button></div>
<input id="q" type="search" placeholder="Куда едем? Кобрин, Каменец…" style="margin-top:8px">
<div class="chips" id="days"></div>
<div class="opt"><label><input type="checkbox" id="up" checked> Только ближайшие</label><span id="clock"></span></div>
</div>
<main><div id="list"></div><div class="note" id="st">Загрузка…</div></main>
<script>
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],$=i=>document.getElementById(i);
let T=[],day,q='',up=true,dir=0,upd='';
const mm=s=>{const[h,m]=s.split(':');return h*60+ +m};
const now=()=>{const d=new Date();return{d:d.getDay()||7,m:d.getHours()*60+d.getMinutes()}};
day=now().d;
function load(j,msg){
 upd=j.updated;T=[];
 j.out.forEach(([n,p,d,a,b,v])=>T.push({n,p,d,a,b,v,m:mm(a),r:0}));
 j.in.forEach(([n,d,a,b,v])=>T.push({n,p:'',d,a,b,v,m:mm(a),r:1}));
 T.sort((x,y)=>x.m-y.m);
 $('st').textContent=(msg?msg+'. ':'')+'Расписание от '+upd+'. Уточняйте по справке 93-37-04 (7:45–20:00).';
 render()}
fetch('schedule.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{
 try{localStorage.setItem('s',JSON.stringify(j))}catch(e){}
 load(j)}).catch(()=>{
 let j=null;try{j=JSON.parse(localStorage.getItem('s'))}catch(e){}
 if(j)load(j,'Нет сети, показаны сохранённые данные');else $('st').textContent='Не удалось загрузить расписание'});
function chips(){const td=now().d;$('days').innerHTML=DN.map((n,i)=>`<button class="chip${i+1==day?' on':''}" data-d="${i+1}">${n}${i+1==td?' · сегодня':''}</button>`).join('')}
function render(){
 const n=now(),isT=day==n.d,qq=q.trim().toLowerCase();
 $('clock').textContent=String(Math.floor(n.m/60)).padStart(2,'0')+':'+String(n.m%60).padStart(2,'0');
 let r=T.filter(t=>t.r==dir&&(t.d=='*'||t.d.includes(day))&&(!qq||(t.n+' '+t.v).toLowerCase().includes(qq)));
 if(up&&isT)r=r.filter(t=>t.m>=n.m);
 $('list').innerHTML=r.length?r.map(t=>{
  const df=t.m-n.m,soon=isT&&df>=0&&df<=60;
  return `<div class="t${isT&&df<0?' past':''}"><div class="tm">${t.a}</div><div class="in"><div class="nm">${dir?t.n+' → Брест':t.n}</div><div class="sb">${dir?'Прибытие в Брест ':'Прибытие '}${t.b}${t.v?' · '+t.v:''}</div>${soon?`<div class="sb soon">через ${df} мин</div>`:''}</div>${t.p?`<div class="pl">платф.<b>${t.p}</b></div>`:''}</div>`}).join(''):'<div class="note">Ничего не найдено. Попробуйте другой день или уберите «Только ближайшие».</div>'}
$('days').onclick=e=>{const b=e.target.closest('[data-d]');if(b){day=+b.dataset.d;chips();render()}};
$('dir').onclick=e=>{const b=e.target.closest('[data-r]');if(b){dir=+b.dataset.r;[...$('dir').children].forEach(c=>c.classList.toggle('on',c==b));render()}};
$('q').oninput=e=>{q=e.target.value;render()};
$('up').onchange=e=>{up=e.target.checked;render()};
chips();setInterval(()=>{chips();render()},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
